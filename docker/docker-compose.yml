services:
  kronos:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: registry.cn-hangzhou.aliyuncs.com/proxy-whit/kronos:1.0.0
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ../finetune/data:/app/finetune/data
      - ../outputs:/app/outputs
      - ../pretrained:/app/pretrained
      - ../logs:/app/logs
    # 默认命令，可通过 docker-compose run 覆盖
    command: train-ddp --use-block --model mini --epochs 50