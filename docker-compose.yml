# =============================================================================
# Kronos Training - Docker Compose
# =============================================================================
# Pretrained weights must be mounted from host (NOT downloaded inside container)
#
# Usage:
#   PRETRAINED_DIR=/root/kronos/pretrained docker compose run --gpus all tokenizer
#   PRETRAINED_DIR=/root/kronos/pretrained DATA_DIR=/root/kronos/csv docker compose run --gpus all pipeline
#
# Required host directories:
#   pretrained/  → Kronos-Tokenizer-2k/ + Kronos-mini/
#   csv/         → exported_kline_data/stocks/*.csv
# =============================================================================

services:
  # ---- Train Tokenizer ----
  tokenizer:
    build: .
    container_name: kronos-tokenizer
    volumes:
      - ${PRETRAINED_DIR:-./pretrained}:/app/pretrained:ro
      - ${DATA_DIR:-./finetune_csv}:/app/finetune_csv
      - ${OUTPUT_DIR:-./outputs}:/app/output
      - ${LOG_DIR:-./logs}:/app/logs
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    command: bash entrypoint.sh --task tokenizer --dataset ${DATASET:-mid} --epochs ${EPOCHS:-30}

  # ---- Train Predictor ----
  predictor:
    build: .
    container_name: kronos-predictor
    volumes:
      - ${PRETRAINED_DIR:-./pretrained}:/app/pretrained:ro
      - ${DATA_DIR:-./finetune_csv}:/app/finetune_csv
      - ${OUTPUT_DIR:-./outputs}:/app/output
      - ${LOG_DIR:-./logs}:/app/logs
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    command: bash entrypoint.sh --task predictor --dataset ${DATASET:-mid}

  # ---- Full Pipeline ----
  pipeline:
    build: .
    container_name: kronos-pipeline
    volumes:
      - ${PRETRAINED_DIR:-./pretrained}:/app/pretrained:ro
      - ${DATA_DIR:-./finetune_csv}:/app/finetune_csv
      - ${OUTPUT_DIR:-./outputs}:/app/output
      - ${LOG_DIR:-./logs}:/app/logs
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    command: bash entrypoint.sh --task pipeline --dataset ${DATASET:-mid}

  # ---- Data Preprocessing (no pretrained models needed) ----
  preprocess:
    build: .
    container_name: kronos-preprocess
    volumes:
      - ${DATA_DIR:-./finetune_csv}:/app/finetune_csv
    command: bash entrypoint.sh --task preprocess --dataset ${DATASET:-mid}

  # ---- Evaluation ----
  evaluate:
    build: .
    container_name: kronos-evaluate
    volumes:
      - ${PRETRAINED_DIR:-./pretrained}:/app/pretrained:ro
      - ${OUTPUT_DIR:-./outputs}:/app/output
      - ${LOG_DIR:-./logs}:/app/logs
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    command: bash entrypoint.sh --task evaluate

  # ---- Interactive Shell ----
  shell:
    build: .
    container_name: kronos-shell
    volumes:
      - ${PRETRAINED_DIR:-./pretrained}:/app/pretrained:ro
      - ${DATA_DIR:-./finetune_csv}:/app/finetune_csv
      - ${OUTPUT_DIR:-./outputs}:/app/output
      - ${LOG_DIR:-./logs}:/app/logs
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    command: bash entrypoint.sh --task shell
